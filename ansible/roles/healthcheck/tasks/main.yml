- name: Check /health endpoint until it returns 200
  ansible.builtin.uri:
    url: "http://localhost:8000/health"
    method: GET
    status_code: 200
  register: healthcheck_result
  until: healthcheck_result.status == 200
  retries: 10
  delay: 3
  ignore_errors: yes

- name: Fail if application is not healthy
  ansible.builtin.fail:
    msg: "Application healthcheck failed! Status code was not 200."
  when: healthcheck_result.status != 200

- name: Print healthcheck result
  ansible.builtin.debug:
    var: healthcheck_result.json