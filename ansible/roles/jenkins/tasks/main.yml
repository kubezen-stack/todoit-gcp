- name: Install Java
  ansible.builtin.apt:
    name: openjdk-17-jdk
    state: present
    update_cache: yes

- name: Add Jenkins GPG key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: "0644"

- name: Add Jenkins repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Start Jenkins
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: yes

- name: Add Jenkins user to docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: yes

- name: Install Ansible
  ansible.builtin.apt:
    name: 
      - ansible
      - python3-pip
    state: present

- name: Install GCP Ansible collection
  ansible.builtin.command:
    cmd: ansible-galaxy collection install google.cloud
  become_user: jenkins

- name: Install Python GCP dependencies
  ansible.builtin.pip:
    name:
      - requests
      - google-auth
    state: present

- name: Wait for Jenkins to be fully up
  ansible.builtin.wait_for:
    port: 8080
    delay: 30
    timeout: 300