plugin: google.cloud.gcp_compute
projects:
  - "{{ lookup('env', 'GCP_PROJECT_ID') }}"
regions:
  - us-central1
filters:
  - labels.environment = dev
  - labels.project = todo-app
  - status = running
keyed_groups:
  - key: labels.role
    prefix: ""
    separator: ""
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP
auth_kind: serviceaccount
service_account_file: "{{ lookup('env', 'GCP_APPLICATION_CREDENTIALS') }}"